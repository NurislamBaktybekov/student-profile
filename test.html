<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Nurislam</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            margin: 0 auto 20px;
        }

        .bio {
            text-align: center;
        }

        form {
            margin-top: 25px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #222;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
        }
    </style>
</head>

<body>

    <!-- Semantic tag: header -->
    <header>
        <h1>Student Profile</h1>
    </header>

    <!-- Semantic tag: main -->
    <main>

        <section class="bio">
            <img src="profile.jpg.jpg" alt="Photo of Nurislam">

            <h2>Nurislam</h2>
            <p>Cyber security student</p>

            <p>
                <a href="https://github.com/gackuu" target="_blank">
                    Visit my GitHub
                </a>
            </p>
        </section>

        <!-- Semantic tag: section -->
        <section>
            <h2>Contact Me</h2>

            <form>
                <label for="name">Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="Nurislam"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="gack6596@gmail.com"
                    required
                >

                <button type="submit">Submit</button>
            </form>
        </section>

    </main>

    <!-- Semantic tag: footer -->
    <footer>
        <p>&copy; 2026 Nurislam</p>
    </footer>

</body>
</html>
